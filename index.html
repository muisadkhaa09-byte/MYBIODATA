    <!-- JavaScript Navigation & Effects -->
    <script>
        const totalSlides = 10; // 0 to 9
        let currentSlide = 0;
        let isHeroMode = false;

        // Initialize On Load
        window.onload = function() {
            renderDots();
            updateSlideUI();
        };

        // Navigate to specific slide directly
        function goToSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            currentSlide = index;
            updateSlideUI();
        }

        // Next Slide Action
        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateSlideUI();
            }
        }

        // Previous Slide Action
        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlideUI();
            }
        }

        // Update active slide, buttons, indicators
        function updateSlideUI() {
            // Hide all slides and remove active class
            for (let i = 0; i < totalSlides; i++) {
                const slideEl = document.getElementById(`slide-${i}`);
                const navBtnEl = document.getElementById(`nav-btn-${i}`);
                
                if (slideEl) slideEl.classList.remove('active');
                if (navBtnEl) navBtnEl.classList.remove('active');
            }

            // Show target slide
            const activeSlide = document.getElementById(`slide-${currentSlide}`);
            if (activeSlide) activeSlide.classList.add('active');

            // Highlight target nav category button
            const activeNavBtn = document.getElementById(`nav-btn-${currentSlide}`);
            if (activeNavBtn) activeNavBtn.classList.add('active');

            // Update Slide Indicator Text
            document.getElementById('slide-indicator').innerText = `SLIDE ${currentSlide} / ${totalSlides - 1}`;

            // Update Prev/Next Buttons state
            document.getElementById('prev-btn').disabled = (currentSlide === 0);
            document.getElementById('next-btn').disabled = (currentSlide === totalSlides - 1);

            // Update Dots
            updateDots();
        }

        // Render Dots for Slide Progress
        function renderDots() {
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('div');
                dot.className = `w-2 h-2 rounded-full cursor-pointer transition-all ${i === 0 ? 'bg-red-500 w-4' : 'bg-gray-700'}`;
                dot.onclick = () => goToSlide(i);
                dot.id = `dot-${i}`;
                dotsContainer.appendChild(dot);
            }
        }

        function updateDots() {
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (dot) {
                    if (i === currentSlide) {
                        dot.className = 'w-4 h-2 rounded-full bg-red-500 transition-all';
                    } else {
                        dot.className = 'w-2 h-2 rounded-full bg-gray-700 transition-all cursor-pointer';
                    }
                }
            }
        }

        // Keyboard Arrow Key Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // Spider-Sense Effect Button
        const spiderSenseBtn = document.getElementById('spider-sense-btn');
        const cardContainer = document.getElementById('cyber-dossier-card');

        spiderSenseBtn.addEventListener('click', () => {
            cardContainer.classList.add('spider-sense-flash');
            
            // Temporary Alert / Feedback
            setTimeout(() => {
                alert('⚡ SPIDER-SENSE BERGETAR! Sinyal Keberadaan Agen Muiz Adkha Maulana Terverifikasi Sangat Kuat!');
            }, 100);

            setTimeout(() => {
                cardContainer.classList.remove('spider-sense-flash');
            }, 2500);
        });

        // Identity Switcher Toggle
        const toggleIdentityBtn = document.getElementById('toggle-identity-btn');
        const identityBtnText = document.getElementById('identity-btn-text');
        const heroTitle = document.getElementById('hero-title-display');
        const heroAlias = document.getElementById('hero-alias-display');

        toggleIdentityBtn.addEventListener('click', () => {
            isHeroMode = !isHeroMode;

            if (isHeroMode) {
                identityBtnText.innerText = "Mode Siswa";
                if(heroTitle) heroTitle.innerText = "SPIDER-MUIZ 🕷️";
                if(heroAlias) heroAlias.innerText = "Alias: The Friendly Neighborhood Tech Student";
            } else {
                identityBtnText.innerText = "Ubah Identitas";
                if(heroTitle) heroTitle.innerText = "MUIZ ADKHA MAULANA";
                if(heroAlias) heroAlias.innerText = `"With great coding power comes great responsibility!"`;
            }
        });
    </script>
</body>
</html>
